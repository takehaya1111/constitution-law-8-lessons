<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">D 分步展开：原条款保留，新信息逐层加入</title><desc id="desc">静态结构说明：按①②③阅读；加入右侧信息时，前面的材料仍可回看。。结构试验，非正式课件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#30595c" stroke-width="1.4"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="64" y="61" font-size="35" font-weight="700" fill="#202326"><tspan x="64" dy="0">D　分步展开：原条款保留，新信息逐层加入</tspan></text><text x="64" y="109" font-size="22" font-weight="400" fill="#60666a"><tspan x="64" dy="0">静态结构说明：按①②③阅读；加入右侧信息时，前面的材料仍可回看。</tspan></text><line x1="64" y1="137" x2="1376" y2="137" stroke="#c9ced1" stroke-width="2"/><rect x="64" y="168" width="1312" height="154" rx="4" fill="#f1f4f4" stroke="#c9ced1" stroke-width="1.5"/><text x="88" y="209" font-size="24" font-weight="700" fill="#30595c"><tspan x="88" dy="0">始终保留｜宪法第41条第3款全文</tspan></text><text x="88" y="254" font-size="29" font-weight="400" fill="#202326"><tspan x="88" dy="0">由于国家机关和国家工作人员侵犯公民权利而受到损失的人，</tspan><tspan x="88" dy="44">有依照法律规定取得赔偿的权利。</tspan></text><rect x="64" y="354" width="421" height="465" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="509" y="354" width="422" height="465" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="955" y="354" width="421" height="465" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><text x="88" y="398" font-size="28" font-weight="700" fill="#202326"><tspan x="88" dy="0">① 先读宪法条款</tspan></text><text x="88" y="451" font-size="26" font-weight="400" fill="#202326"><tspan x="88" dy="0">先看见：</tspan><tspan x="88" dy="43">国家侵权受损者有依法</tspan><tspan x="88" dy="43">取得赔偿的权利。</tspan></text><text x="88" y="600" font-size="25" font-weight="400" fill="#202326"><tspan x="88" dy="0">留下待回答的问题：</tspan><tspan x="88" dy="43">本例是哪种赔偿情形？</tspan><tspan x="88" dy="43">谁负义务？</tspan><tspan x="88" dy="43">请求怎样提出？</tspan></text><text x="533" y="398" font-size="28" font-weight="700" fill="#202326"><tspan x="533" dy="0">② 加入具体法律</tspan></text><text x="533" y="439" font-size="20" font-weight="400" fill="#60666a"><tspan x="533" dy="0">以下为定位提要，原文见附页</tspan></text><text x="533" y="483" font-size="22" font-weight="400" fill="#202326"><tspan x="533" dy="0">第3条：行政职权中的违法拘留</tspan><tspan x="533" dy="40">第7条：相应行政机关负赔偿义务</tspan></text><text x="533" y="581" font-size="22" font-weight="400" fill="#202326"><tspan x="533" dy="0">第9条：单独请求先向义务机关</tspan><tspan x="533" dy="38">提出；复议或诉讼时也可一并</tspan><tspan x="533" dy="38">提出。</tspan></text><text x="533" y="733" font-size="24" font-weight="700" fill="#30595c"><tspan x="533" dy="0">具体条件已出现；</tspan><tspan x="533" dy="38">还要知道本题事实是否符合。</tspan></text><text x="979" y="398" font-size="26" font-weight="700" fill="#202326"><tspan x="979" dy="0">③ 加入事实，再作判断</tspan></text><text x="979" y="438" font-size="20" font-weight="700" fill="#60666a"><tspan x="979" dy="0">教学设例｜以下事实已查明</tspan></text><text x="979" y="477" font-size="22" font-weight="400" fill="#202326"><tspan x="979" dy="0">县公安局工作人员以本机关名义，</tspan><tspan x="979" dy="32">在行使行政职权时违法拘留甲，</tspan><tspan x="979" dy="32">侵害甲的人身自由。无共同机关、</tspan><tspan x="979" dy="32">委托、机关撤销或法定不赔情形。</tspan><tspan x="979" dy="32">甲现在单独请求国家赔偿。</tspan></text><line x1="979" y1="631" x2="1352" y2="631" stroke="#c9ced1" stroke-width="2"/><text x="979" y="663" font-size="22" font-weight="700" fill="#30595c"><tspan x="979" dy="0">依上述事实和条文：</tspan></text><text x="979" y="697" font-size="22" font-weight="400" fill="#202326"><tspan x="979" dy="0">甲有赔偿权；该县公安局为义务</tspan><tspan x="979" dy="32">机关；单独请求先向该机关提出。</tspan></text><text x="979" y="773" font-size="20" font-weight="400" fill="#60666a"><tspan x="979" dy="0">限度：违法性已给定；不算金额，</tspan><tspan x="979" dy="28">不判断全部后续程序。</tspan></text><line x1="64" y1="845" x2="1376" y2="845" stroke="#c9ced1" stroke-width="2"/><text x="64" y="876" font-size="20" font-weight="400" fill="#60666a"><tspan x="64" dy="0">结构试验，非正式课件</tspan></text><text x="835" y="876" font-size="20" font-weight="400" fill="#60666a"><tspan x="835" dy="0">依本轮讲述单元及其材料附页制作</tspan></text></g></svg>