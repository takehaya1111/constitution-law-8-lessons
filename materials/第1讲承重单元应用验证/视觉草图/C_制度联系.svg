<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">C 四个位置，各自承担什么任务</title><desc id="desc">箭头表示制度联系；能否实际实现，还要看依法办理的过程。。结构试验，非正式课件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#30595c" stroke-width="1.4"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="64" y="61" font-size="35" font-weight="700" fill="#202326"><tspan x="64" dy="0">C　四个位置，各自承担什么任务</tspan></text><text x="64" y="109" font-size="22" font-weight="400" fill="#60666a"><tspan x="64" dy="0">箭头表示制度联系；能否实际实现，还要看依法办理的过程。</tspan></text><line x1="64" y1="137" x2="1376" y2="137" stroke="#c9ced1" stroke-width="2"/><rect x="64" y="170" width="1312" height="110" rx="4" fill="#f1f4f4" stroke="#c9ced1" stroke-width="1.5"/><text x="88" y="211" font-size="24" font-weight="700" fill="#30595c"><tspan x="88" dy="0">宪法第5条第3款的约束贯穿：</tspan></text><text x="88" y="251" font-size="27" font-weight="400" fill="#202326"><tspan x="88" dy="0">一切法律、行政法规和地方性法规都不得同宪法相抵触。</tspan></text><rect x="64" y="390" width="244" height="261" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="416" y="390" width="244" height="261" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="768" y="390" width="244" height="261" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="1120" y="390" width="256" height="261" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><text x="84" y="438" font-size="29" font-weight="700" fill="#202326"><tspan x="84" dy="0">宪法权利要求</tspan></text><text x="84" y="481" font-size="22" font-weight="700" fill="#30595c"><tspan x="84" dy="0">第41条第3款</tspan></text><text x="84" y="528" font-size="24" font-weight="400" fill="#202326"><tspan x="84" dy="0">国家侵权受损者</tspan><tspan x="84" dy="39">有依照法律规定</tspan><tspan x="84" dy="39">取得赔偿的权利</tspan></text><text x="436" y="438" font-size="29" font-weight="700" fill="#202326"><tspan x="436" dy="0">普通法规定</tspan></text><text x="436" y="481" font-size="22" font-weight="700" fill="#30595c"><tspan x="436" dy="0">国家赔偿法</tspan></text><text x="436" y="528" font-size="24" font-weight="400" fill="#202326"><tspan x="436" dy="0">规定具体情形、</tspan><tspan x="436" dy="39">赔偿义务机关和</tspan><tspan x="436" dy="39">请求提出途径</tspan></text><text x="788" y="438" font-size="25" font-weight="700" fill="#202326"><tspan x="788" dy="0">机关依法办理赔偿</tspan></text><text x="788" y="481" font-size="22" font-weight="700" fill="#30595c"><tspan x="788" dy="0">依事实和法律办理</tspan></text><text x="788" y="528" font-size="24" font-weight="400" fill="#202326"><tspan x="788" dy="0">核对相应条件</tspan><tspan x="788" dy="39">履行赔偿义务</tspan><tspan x="788" dy="39">依法回应请求</tspan></text><text x="1140" y="438" font-size="29" font-weight="700" fill="#202326"><tspan x="1140" dy="0">法定权利救济</tspan></text><text x="1140" y="481" font-size="22" font-weight="700" fill="#30595c"><tspan x="1140" dy="0">本例：赔偿救济</tspan></text><text x="1140" y="528" font-size="24" font-weight="400" fill="#202326"><tspan x="1140" dy="0">受害人的赔偿请求</tspan><tspan x="1140" dy="39">通过法定制度</tspan><tspan x="1140" dy="39">获得依法处理</tspan></text><path d="M 316 540 H 409" fill="none" stroke="#30595c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 668 540 H 761" fill="none" stroke="#30595c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1020 540 H 1113" fill="none" stroke="#30595c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="318" y="477" font-size="21" font-weight="700" fill="#30595c"><tspan x="318" dy="0">在约束下</tspan><tspan x="318" dy="31">具体规定</tspan></text><text x="670" y="477" font-size="21" font-weight="700" fill="#30595c"><tspan x="670" dy="0">核对事实</tspan><tspan x="670" dy="31">适用规则</tspan></text><text x="1022" y="477" font-size="21" font-weight="700" fill="#30595c"><tspan x="1022" dy="0">履行义务</tspan><tspan x="1022" dy="31">提供救济</tspan></text><text x="64" y="714" font-size="25" font-weight="700" fill="#202326"><tspan x="64" dy="0">这里的“依法办理”指办理赔偿请求；引发请求的违法侵权另属前提事实。</tspan></text><text x="64" y="760" font-size="25" font-weight="400" fill="#202326"><tspan x="64" dy="0">这不是自动兑现的流程：条文存在，并不证明现实中已经依法办理或充分保障。</tspan></text><text x="64" y="803" font-size="23" font-weight="400" fill="#60666a"><tspan x="64" dy="0">它也不是全部宪法实施路径。图中只说明本单元有明确条文联系的赔偿安排。</tspan></text><line x1="64" y1="845" x2="1376" y2="845" stroke="#c9ced1" stroke-width="2"/><text x="64" y="876" font-size="20" font-weight="400" fill="#60666a"><tspan x="64" dy="0">结构试验，非正式课件</tspan></text><text x="835" y="876" font-size="20" font-weight="400" fill="#60666a"><tspan x="835" dy="0">依本轮讲述单元及其材料附页制作</tspan></text></g></svg>