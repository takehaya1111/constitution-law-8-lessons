<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">B 把权利根据与具体安排放在一起读</title><desc id="desc">上部对读两条完整条文；下部沿“情形—主体—途径”定位。。结构试验，非正式课件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#30595c" stroke-width="1.4"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="64" y="61" font-size="35" font-weight="700" fill="#202326"><tspan x="64" dy="0">B　把权利根据与具体安排放在一起读</tspan></text><text x="64" y="109" font-size="22" font-weight="400" fill="#60666a"><tspan x="64" dy="0">上部对读两条完整条文；下部沿“情形—主体—途径”定位。</tspan></text><line x1="64" y1="137" x2="1376" y2="137" stroke="#c9ced1" stroke-width="2"/><rect x="64" y="170" width="644" height="221" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="732" y="170" width="644" height="221" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><text x="88" y="212" font-size="24" font-weight="700" fill="#202326"><tspan x="88" dy="0">宪法第41条第3款｜全文</tspan></text><text x="88" y="256" font-size="25" font-weight="400" fill="#202326"><tspan x="88" dy="0">由于国家机关和国家工作人员侵犯公民权利</tspan><tspan x="88" dy="39">而受到损失的人，有依照法律规定取得赔偿</tspan><tspan x="88" dy="39">的权利。</tspan></text><text x="756" y="212" font-size="24" font-weight="700" fill="#202326"><tspan x="756" dy="0">国家赔偿法第1条｜全文</tspan></text><text x="756" y="256" font-size="25" font-weight="400" fill="#202326"><tspan x="756" dy="0">为保障公民、法人和其他组织享有依法取得</tspan><tspan x="756" dy="39">国家赔偿的权利，促进国家机关依法行使</tspan><tspan x="756" dy="39">职权，根据宪法，制定本法。</tspan></text><text x="64" y="435" font-size="27" font-weight="700" fill="#202326"><tspan x="64" dy="0">国家赔偿法增加了哪些具体规定？</tspan></text><rect x="64" y="460" width="421" height="348" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="509" y="460" width="422" height="348" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="955" y="460" width="421" height="348" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><text x="87" y="502" font-size="23" font-weight="700" fill="#30595c"><tspan x="87" dy="0">情形｜第3条起句及第1项</tspan></text><text x="87" y="534" font-size="19" font-weight="400" fill="#60666a"><tspan x="87" dy="0">节录，其他项略</tspan></text><text x="87" y="576" font-size="22" font-weight="400" fill="#202326"><tspan x="87" dy="0">行政机关及其工作人员在行使行政</tspan><tspan x="87" dy="38">职权时有下列侵犯人身权情形之一</tspan><tspan x="87" dy="38">的，受害人有取得赔偿的权利：</tspan><tspan x="87" dy="38">（一）违法拘留或者违法采取限制</tspan><tspan x="87" dy="38">公民人身自由的行政强制措施的；</tspan></text><text x="532" y="502" font-size="23" font-weight="700" fill="#30595c"><tspan x="532" dy="0">主体｜第7条第1款</tspan></text><text x="532" y="534" font-size="19" font-weight="400" fill="#60666a"><tspan x="532" dy="0">该款全文</tspan></text><text x="532" y="576" font-size="22" font-weight="400" fill="#202326"><tspan x="532" dy="0">行政机关及其工作人员行使行政</tspan><tspan x="532" dy="38">职权侵犯公民、法人和其他组织的</tspan><tspan x="532" dy="38">合法权益造成损害的，该行政机关</tspan><tspan x="532" dy="38">为赔偿义务机关。</tspan></text><text x="978" y="502" font-size="23" font-weight="700" fill="#30595c"><tspan x="978" dy="0">途径｜第9条第2款</tspan></text><text x="978" y="534" font-size="19" font-weight="400" fill="#60666a"><tspan x="978" dy="0">该款全文</tspan></text><text x="978" y="576" font-size="22" font-weight="400" fill="#202326"><tspan x="978" dy="0">赔偿请求人要求赔偿，应当先向</tspan><tspan x="978" dy="38">赔偿义务机关提出，也可以在申请</tspan><tspan x="978" dy="38">行政复议或者提起行政诉讼时一并</tspan><tspan x="978" dy="38">提出。</tspan></text><line x1="64" y1="845" x2="1376" y2="845" stroke="#c9ced1" stroke-width="2"/><text x="64" y="876" font-size="20" font-weight="400" fill="#60666a"><tspan x="64" dy="0">结构试验，非正式课件</tspan></text><text x="835" y="876" font-size="20" font-weight="400" fill="#60666a"><tspan x="835" dy="0">依本轮讲述单元及其材料附页制作</tspan></text></g></svg>