<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">A 先区分正在回答的两个问题</title><desc id="desc">最高效力说明约束；具体展开说明制度内容。。结构试验，非正式课件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#30595c" stroke-width="1.4"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="64" y="61" font-size="35" font-weight="700" fill="#202326"><tspan x="64" dy="0">A　先区分正在回答的两个问题</tspan></text><text x="64" y="109" font-size="22" font-weight="400" fill="#60666a"><tspan x="64" dy="0">最高效力说明约束；具体展开说明制度内容。</tspan></text><line x1="64" y1="137" x2="1376" y2="137" stroke="#c9ced1" stroke-width="2"/><rect x="64" y="174" width="644" height="526" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><rect x="732" y="174" width="644" height="526" rx="4" fill="#f4f5f5" stroke="#c9ced1" stroke-width="1.5"/><text x="96" y="227" font-size="31" font-weight="700" fill="#202326"><tspan x="96" dy="0">最高效力：约束普通法律</tspan></text><text x="96" y="283" font-size="27" font-weight="700" fill="#30595c"><tspan x="96" dy="0">普通法律能否背离宪法？</tspan></text><text x="96" y="344" font-size="22" font-weight="700" fill="#60666a"><tspan x="96" dy="0">宪法第5条第3款</tspan></text><text x="96" y="390" font-size="27" font-weight="400" fill="#202326"><tspan x="96" dy="0">一切法律、行政法规和地方性法规</tspan><tspan x="96" dy="43">都不得同宪法相抵触。</tspan></text><line x1="96" y1="470" x2="676" y2="470" stroke="#c9ced1" stroke-width="2"/><text x="96" y="519" font-size="24" font-weight="400" fill="#202326"><tspan x="96" dy="0">普通法律的制定和实施都受宪法约束。</tspan><tspan x="96" dy="42">规定得更详细，不等于可以排除宪法要求。</tspan></text><text x="96" y="649" font-size="23" font-weight="400" fill="#60666a"><tspan x="96" dy="0">它不替代个案所需的全部具体规则。</tspan></text><text x="764" y="227" font-size="31" font-weight="700" fill="#202326"><tspan x="764" dy="0">具体展开：情形／主体／途径</tspan></text><text x="764" y="283" font-size="27" font-weight="700" fill="#30595c"><tspan x="764" dy="0">这项权利怎样进入具体办理？</tspan></text><text x="764" y="357" font-size="26" font-weight="700" fill="#202326"><tspan x="764" dy="0">情形　哪些侵害由该制度处理</tspan></text><text x="764" y="407" font-size="26" font-weight="700" fill="#202326"><tspan x="764" dy="0">主体　哪个机关承担赔偿义务</tspan></text><text x="764" y="457" font-size="26" font-weight="700" fill="#202326"><tspan x="764" dy="0">途径　请求怎样提出</tspan></text><line x1="764" y1="490" x2="1344" y2="490" stroke="#c9ced1" stroke-width="2"/><text x="764" y="539" font-size="24" font-weight="400" fill="#202326"><tspan x="764" dy="0">法律需要作出具体制度选择。</tspan><tspan x="764" dy="42">这些安排仍须尊重宪法已经确认的权利。</tspan></text><text x="764" y="649" font-size="23" font-weight="400" fill="#60666a"><tspan x="764" dy="0">需要展开，不等于宪法此前没有效力。</tspan></text><text x="64" y="759" font-size="29" font-weight="700" fill="#202326"><tspan x="64" dy="0">同一项赔偿权，同时涉及这两层关系。</tspan></text><text x="64" y="805" font-size="25" font-weight="400" fill="#202326"><tspan x="64" dy="0">先确认必须遵守什么，再看法律怎样把相应要求写成可以据以办事的规定。</tspan></text><line x1="64" y1="845" x2="1376" y2="845" stroke="#c9ced1" stroke-width="2"/><text x="64" y="876" font-size="20" font-weight="400" fill="#60666a"><tspan x="64" dy="0">结构试验，非正式课件</tspan></text><text x="835" y="876" font-size="20" font-weight="400" fill="#60666a"><tspan x="835" dy="0">依本轮讲述单元及其材料附页制作</tspan></text></g></svg>