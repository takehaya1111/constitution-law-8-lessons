<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>土地条款旧新对读题面</title><defs><marker id="time" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8C9690"/></marker></defs><rect width="1600" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="85" font-size="44" fill="#24312D" font-weight="700">第10条：所有权归属与使用安排</text><text x="70" y="130" font-size="24" fill="#24312D" >结构草图02｜题面状态；旧新条文尚未标出改动答案</text><rect x="80" y="180" width="1440" height="120" fill="#F5F6F3" stroke="#F5F6F3" stroke-width="1.5"/><text x="105" y="224" font-size="25" fill="#24312D" font-weight="700">第10条第1款｜与下方两版第4款连读</text><text x="105" y="274" font-size="34" fill="#24312D" >城市的土地属于国家所有。</text><text x="100" y="375" font-size="31" fill="#24312D" font-weight="700">1982年原文｜第4款</text><text x="860" y="375" font-size="31" fill="#24312D" font-weight="700">1988年修正后｜第4款</text><rect x="80" y="400" width="680" height="330" fill="white" stroke="#8C9690" stroke-width="1.5"/><rect x="840" y="400" width="680" height="330" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="100" y="470" font-size="29" fill="#24312D" >任何组织或者个人不得侵占、买卖、</text><text x="860" y="470" font-size="29" fill="#24312D" >任何组织或者个人不得侵占、买卖</text><text x="100" y="525" font-size="29" fill="#24312D" >出租或者以其他形式非法转让土地。</text><text x="860" y="525" font-size="29" fill="#24312D" >或者以其他形式非法转让土地。</text><text x="860" y="610" font-size="29" fill="#24312D" >土地的使用权可以依照法律的规定转让。</text><text x="90" y="815" font-size="31" fill="#24312D" >请圈出第4款的改动，再连读第1款：</text><text x="90" y="867" font-size="31" fill="#24312D" >这次修改改变了什么，又保留了什么？用实际文字说明。</text><text x="80" y="954" font-size="19" fill="#24312D" >引文：1982年宪法第10条原文；1988年修正案第2条所确定的新文字。原文标点保留。</text></g></svg>