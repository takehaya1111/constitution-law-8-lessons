<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>四份完整文本与五次部分修正</title><defs><marker id="time" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8C9690"/></marker></defs><rect width="1600" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="85" font-size="44" fill="#24312D" font-weight="700">两种层次：完整文本与此后的部分修正</text><text x="70" y="130" font-size="24" fill="#24312D" >结构草图01｜定位沿革；箭头仅表示时间先后，不表示自动进步或历史因果</text><text x="80" y="212" font-size="32" fill="#24312D" font-weight="700">新中国先后颁布的四份完整宪法文本</text><rect x="80" y="250" width="285" height="140" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="105" y="310" font-size="42" fill="#24312D" font-weight="700">1954</text><text x="105" y="360" font-size="27" fill="#24312D" >第一部宪法</text><line x1="377" y1="320" x2="438" y2="320" stroke="#8C9690" stroke-width="2" marker-end="url(#time)"/><rect x="455" y="250" width="285" height="140" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="480" y="310" font-size="42" fill="#24312D" font-weight="700">1975</text><text x="480" y="360" font-size="27" fill="#24312D" >完整文本</text><line x1="752" y1="320" x2="813" y2="320" stroke="#8C9690" stroke-width="2" marker-end="url(#time)"/><rect x="830" y="250" width="285" height="140" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="855" y="310" font-size="42" fill="#24312D" font-weight="700">1978</text><text x="855" y="360" font-size="27" fill="#24312D" >完整文本</text><line x1="1127" y1="320" x2="1188" y2="320" stroke="#8C9690" stroke-width="2" marker-end="url(#time)"/><rect x="1205" y="250" width="285" height="140" fill="#EDF1EE" stroke="#8C9690" stroke-width="1.5"/><text x="1230" y="310" font-size="42" fill="#24312D" font-weight="700">1982</text><text x="1230" y="360" font-size="27" fill="#24312D" >完整文本</text><text x="80" y="440" font-size="27" fill="#24312D" >后三份亦可从修改方式称为全面修改；本图按重新颁布的完整文本计数。</text><text x="80" y="565" font-size="32" fill="#24312D" font-weight="700">1982年宪法此后的五次部分修正</text><rect x="80" y="605" width="220" height="110" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="107" y="674" font-size="40" fill="#24312D" font-weight="700">1988</text><line x1="310" y1="660" x2="363" y2="660" stroke="#8C9690" stroke-width="2" marker-end="url(#time)"/><rect x="380" y="605" width="220" height="110" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="407" y="674" font-size="40" fill="#24312D" font-weight="700">1993</text><line x1="610" y1="660" x2="663" y2="660" stroke="#8C9690" stroke-width="2" marker-end="url(#time)"/><rect x="680" y="605" width="220" height="110" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="707" y="674" font-size="40" fill="#24312D" font-weight="700">1999</text><line x1="910" y1="660" x2="963" y2="660" stroke="#8C9690" stroke-width="2" marker-end="url(#time)"/><rect x="980" y="605" width="220" height="110" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="1007" y="674" font-size="40" fill="#24312D" font-weight="700">2004</text><line x1="1210" y1="660" x2="1263" y2="660" stroke="#8C9690" stroke-width="2" marker-end="url(#time)"/><rect x="1280" y="605" width="220" height="110" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="1307" y="674" font-size="40" fill="#24312D" font-weight="700">2018</text><text x="80" y="770" font-size="28" fill="#24312D" >这些修正延续1982年现行宪法的身份，同时实际改变其中的部分规范。</text><rect x="80" y="820" width="1420" height="80" fill="#F5F6F3" stroke="#F5F6F3" stroke-width="1.5"/><text x="105" y="872" font-size="27" fill="#24312D" >全景定位不代替条文对读；每次修正的范围不同，本图不列全部修改内容。</text><text x="80" y="954" font-size="19" fill="#24312D" >依据：现行宪法题注；教材及同期形成材料。完整来源、版本和阅读范围见配套研究。</text></g></svg>