<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>土地条款旧新对读讲评</title><defs><marker id="time" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8C9690"/></marker></defs><rect width="1600" height="1000" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="85" font-size="44" fill="#24312D" font-weight="700">第10条：所有权归属与使用安排</text><text x="70" y="130" font-size="24" fill="#24312D" >结构草图03｜讲评状态；标色、划线属于教学标注</text><rect x="80" y="180" width="1440" height="120" fill="#F5F6F3" stroke="#F5F6F3" stroke-width="1.5"/><text x="105" y="224" font-size="25" fill="#24312D" font-weight="700">第1款保留｜两版共同的规定</text><text x="105" y="274" font-size="34" fill="#24312D" >城市的土地属于国家所有。</text><text x="100" y="375" font-size="31" fill="#24312D" font-weight="700">1982年原文｜第4款</text><text x="860" y="375" font-size="31" fill="#24312D" font-weight="700">1988年修正后｜第4款</text><rect x="80" y="400" width="680" height="330" fill="white" stroke="#8C9690" stroke-width="1.5"/><rect x="840" y="400" width="680" height="330" fill="white" stroke="#8C9690" stroke-width="1.5"/><text x="100" y="470" font-size="29" fill="#24312D" >任何组织或者个人不得侵占、买卖、</text><text x="860" y="470" font-size="29" fill="#24312D" >任何组织或者个人不得侵占、买卖</text><text x="100" y="525" font-size="29"><tspan fill="#A34730" text-decoration="line-through">出租</tspan><tspan fill="#24312D">或者以其他形式非法转让土地。</tspan></text><text x="860" y="525" font-size="29" fill="#24312D" >或者以其他形式非法转让土地。</text><rect x="853" y="568" width="654" height="80" fill="#F5EEE8" stroke="#F5EEE8" stroke-width="1.5"/><text x="860" y="610" font-size="29" fill="#24312D" >土地的使用权可以依照法律的规定转让。</text><text x="102" y="640" font-size="27"  fill="#A34730">删去列举中的“出租”</text><text x="90" y="815" font-size="30" fill="#24312D" >保留：城市土地国家所有。新增：使用权可以依法转让。</text><text x="90" y="867" font-size="30" fill="#24312D" >这不等于土地所有权可以买卖；具体交易仍须核适用法律与事实。</text><text x="80" y="954" font-size="19" fill="#24312D" >引文同题面；删除线与底色只标示修改位置，不替代对原文及法律条件的判断。</text></g></svg>