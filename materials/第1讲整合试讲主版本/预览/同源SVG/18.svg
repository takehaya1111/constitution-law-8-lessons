<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900"><title>“根据宪法”，先告诉我们什么？</title><desc>由课程内容源生成的可回查SVG，实际PPT导出预览见PDF及逐页PNG。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D32"/></marker></defs><rect width="1600" height="900" fill="#F7F4ED"/><text x="93.60000000000001" y="67.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28.333333333333332" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="93.60000000000001" dy="0">二 根本要求怎样进入具体制度</tspan></text><text x="91.2" y="166.79999999999998" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="91.2" dy="0">“根据宪法”，先告诉我们什么？</tspan></text><rect x="93.60000000000001" y="249.60000000000002" width="679.2" height="480" fill="#FFFFFF"/><text x="120" y="311.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="120" dy="0">宪法第41条第3款</tspan></text><text x="120" y="403.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="120" dy="0">由于国家机关和国家工作人员侵</tspan><tspan x="120" dy="47.99999999999999">犯公民权利而受到损失的人，有</tspan><tspan x="120" dy="47.99999999999999">依照法律规定取得赔偿的权利。</tspan></text><rect x="830.4000000000001" y="249.60000000000002" width="679.2" height="480" fill="#E8ECE6"/><text x="856.8000000000001" y="311.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="856.8000000000001" dy="0">国家赔偿法第1条</tspan></text><text x="856.8000000000001" y="403.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="856.8000000000001" dy="0">为保障公民、法人和其他组织享</tspan><tspan x="856.8000000000001" dy="47.99999999999999">有依法取得国家赔偿的权利，促</tspan><tspan x="856.8000000000001" dy="47.99999999999999">进国家机关依法行使职权，根据</tspan><tspan x="856.8000000000001" dy="47.99999999999999">宪法，制定本法。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">依据和目的已经显明；办理条件仍须继续往下读。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">宪法第41条第3款；国家赔偿法第1条（2012年第二次修正）</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">18 / 36</tspan></text></svg>