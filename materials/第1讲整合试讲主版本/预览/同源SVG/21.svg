001" dy="0">普通法律安排情形、主体和办理</tspan><tspan x="856.8000000000001" dy="47.99999999999999">方式；国家机关依法获取、核实</tspan><tspan x="856.8000000000001" dy="47.99999999999999">请求所需的信息。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">宪法约束制度安排；法律确定办法，机关依法办理。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">宪法第5条第3款、第41条第3款；国家赔偿法第12条第1款起句及第2项</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">21 / 31</tspan></text></svg>