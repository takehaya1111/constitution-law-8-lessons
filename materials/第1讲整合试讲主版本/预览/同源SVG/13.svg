<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900"><title>根本规则可以改变，但修改有特别要求</title><desc>由课程内容源生成的可回查SVG，实际PPT导出预览见PDF及逐页PNG。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D32"/></marker></defs><rect width="1600" height="900" fill="#F7F4ED"/><text x="93.60000000000001" y="67.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28.333333333333332" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="93.60000000000001" dy="0">上节｜第一讲 宪法总论</tspan></text><text x="91.2" y="166.79999999999998" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="91.2" dy="0">根本规则可以改变，但修改有特别要求</tspan></text><rect x="93.60000000000001" y="249.60000000000002" width="679.2" height="480" fill="#FFFFFF"/><text x="120" y="311.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="120" dy="0">第64条｜通过门槛</tspan></text><text x="120" y="403.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="120" dy="0">宪法修改：全体</tspan><tspan x="120" dy="47.99999999999999">代表三分之二以上</tspan><tspan x="120" dy="47.99999999999999">法律和其他议案：</tspan><tspan x="120" dy="47.99999999999999">全体代表过半数</tspan></text><rect x="830.4000000000001" y="249.60000000000002" width="679.2" height="480" fill="#E8ECE6"/><text x="856.8000000000001" y="311.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="856.8000000000001" dy="0">同一分母，不同要求</tspan></text><text x="856.8000000000001" y="403.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="856.8000000000001" dy="0">“全体代表”不是到会或投票人</tspan><tspan x="856.8000000000001" dy="47.99999999999999">数；严格程序兼顾</tspan><tspan x="856.8000000000001" dy="47.99999999999999">稳定与依法调整。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">精确门槛依法适用；程序特殊性不等于永远不得修改。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">宪法第64条两款（屏幕为通过要求节录）</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">13 / 31</tspan></text></svg>