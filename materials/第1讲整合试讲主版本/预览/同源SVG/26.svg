<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900"><title>任务4讲评：把已有约束与新增安排同时说清</title><desc>由课程内容源生成的可回查SVG，实际PPT导出预览见PDF及逐页PNG。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D32"/></marker></defs><rect width="1600" height="900" fill="#F7F4ED"/><text x="93.60000000000001" y="67.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28.333333333333332" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="93.60000000000001" dy="0">二 根本要求怎样进入具体制度</tspan></text><text x="91.2" y="166.79999999999998" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="91.2" dy="0">任务4讲评：把已有约束与新增安排同时说清</tspan></text><rect x="93.60000000000001" y="252" width="9.6" height="222.6" fill="#9B3D32"/><text x="121.2" y="293.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="121.2" dy="0">已经有的</tspan><tspan x="121.2" dy="47.99999999999999">宪法要求</tspan></text><text x="447.6" y="293.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="447.6" dy="0">相应赔偿权已获确认；普通法律不得抵触宪法。</tspan></text><rect x="93.60000000000001" y="506.99999999999994" width="9.6" height="222.6" fill="#9B3D32"/><text x="121.2" y="548.9999999999999" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="121.2" dy="0">法律仍须</tspan><tspan x="121.2" dy="47.99999999999999">形成的安排</tspan></text><text x="447.6" y="548.9999999999999" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="447.6" dy="0">例如第7条确定赔偿义务机关，</tspan><tspan x="447.6" dy="47.99999999999999">供请求人与办理者据以判断。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">解释具体化，应同时说明“增加了什么”和“受什么约束”。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">任务4参考说明｜宪法第5、41条；国家赔偿法第3、7、9条</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">26 / 36</tspan></text></svg>