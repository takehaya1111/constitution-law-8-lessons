<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900"><title>机关依法产生，为什么还要依法履职？</title><desc>由课程内容源生成的可回查SVG，实际PPT导出预览见PDF及逐页PNG。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D32"/></marker></defs><rect width="1600" height="900" fill="#F7F4ED"/><text x="93.60000000000001" y="67.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28.333333333333332" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="93.60000000000001" dy="0">上节｜第一讲 宪法总论</tspan></text><text x="91.2" y="166.79999999999998" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="91.2" dy="0">机关依法产生，为什么还要依法履职？</tspan></text><rect x="93.60000000000001" y="249.60000000000002" width="679.2" height="302.4" fill="#FFFFFF"/><text x="120" y="311.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="120" dy="0">法定地位与具体行为</tspan></text><text x="120" y="403.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="120" dy="0">依法产生确认机关位置；具体行</tspan><tspan x="120" dy="47.99999999999999">为仍须说明职权、条件与依据。</tspan></text><rect x="830.4000000000001" y="249.60000000000002" width="679.2" height="302.4" fill="#E8ECE6"/><text x="856.8000000000001" y="311.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="856.8000000000001" dy="0">履职与监督各有职责</tspan></text><text x="856.8000000000001" y="403.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="856.8000000000001" dy="0">依法判断、承担责任、依法监</tspan><tspan x="856.8000000000001" dy="47.99999999999999">督；监督也须有自身权限。</tspan></text><text x="100.8" y="624" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="100.8" dy="0">本质的必要</tspan><tspan x="100.8" dy="47.99999999999999">入口</tspan></text><text x="360" y="624" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="360" dy="0">把人民当家作主形成制度，并确认为共同遵循的法律要求。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">把权力的归属写清楚，还要把行使权力的责任写清楚。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">宪法第2、3条；教材印刷20—21页</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">8 / 31</tspan></text></svg>