" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="606" dy="0">人民代表大会对人民负责，受人民监督。</tspan></text><line x1="331.2" y1="554.8" x2="331.2" y2="608.8000000000001" stroke="#9B3D32" stroke-width="2" marker-end="url(#arrow)"/><text x="364.8" y="588.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#9B3D32" text-anchor="start"><tspan x="364.8" dy="0">由人大产生</tspan></text><rect x="105.6" y="611.2" width="451.2" height="118.4" fill="#E8ECE6"/><text x="127.2" y="662.8" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="127.2" dy="0">行政、监察、</tspan><tspan x="127.2" dy="47.99999999999999">审判、检察机关</tspan></text><text x="606" y="659.1999999999999" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="606" dy="0">这些机关对人民代表大会</tspan><tspan x="606" dy="47.99999999999999">负责，受人民代表大会监督。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">人大选举含直接、间接层级；负责与监督另读右侧。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">现行宪法第2条、第3条前三款（图为关系提要）</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">7 / 36</tspan></text></svg>