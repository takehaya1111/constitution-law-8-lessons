<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900"><title>“属于人民”，怎样进入国家机构？</title><desc>由课程内容源生成的可回查SVG，实际PPT导出预览见PDF及逐页PNG。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D32"/></marker></defs><rect width="1600" height="900" fill="#F7F4ED"/><text x="93.60000000000001" y="67.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28.333333333333332" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="93.60000000000001" dy="0">一 国家生活的根本规则</tspan></text><text x="91.2" y="166.79999999999998" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="91.2" dy="0">“属于人民”，怎样进入国家机构？</tspan></text><rect x="105.6" y="256.8" width="451.2" height="142.4" fill="#343E3B"/><text x="127.2" y="308.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#F7F4ED" text-anchor="start"><tspan x="127.2" dy="0">人民</tspan></text><text x="606" y="304.8" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="606" dy="0">国家的一切权力属于人民。</tspan></text><line x1="331.2" y1="401.6000000000001" x2="331.2" y2="419.6" stroke="#9B3D32" stroke-width="2" marker-end="url(#arrow)"/><rect x="105.6" y="422" width="451.2" height="142.4" fill="#E8ECE6"/><text x="127.2" y="473.59999999999997" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="127.2" dy="0">人民代表大会</tspan></text><text x="606" y="470" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="606" dy="0">由民主选举产生，对人民负责，受人民监督。</tspan></text><line x1="331.2" y1="566.8" x2="331.2" y2="584.8000000000001" stroke="#9B3D32" stroke-width="2" marker-end="url(#arrow)"/><rect x="105.6" y="587.2" width="451.2" height="142.4" fill="#E8ECE6"/><text x="127.2" y="638.8" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="127.2" dy="0">行政、监察、</tspan><tspan x="127.2" dy="47.99999999999999">审判、检察机关</tspan></text><text x="606" y="635.1999999999999" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="606" dy="0">由人民代表大会产生，对它负责，受它监督。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">连线要读出产生、负责和监督，不能只认机关名称。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">现行宪法第2条、第3条前三款（图为关系提要）</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">7 / 36</tspan></text></svg>