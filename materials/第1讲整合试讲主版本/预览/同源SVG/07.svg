6" y="473.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="645.6" dy="0">人民代表大会对人民负责，受人民监督。</tspan></text><line x1="300" y1="549.6" x2="300" y2="593.9999999999999" stroke="#9B3D32" stroke-width="2" marker-end="url(#arrow)"/><text x="336" y="580.8" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#9B3D32" text-anchor="start"><tspan x="336" dy="0">由人大产生</tspan></text><rect x="105.6" y="597.6" width="489.6" height="120" fill="#E8ECE6"/><text x="127.2" y="645.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="127.2" dy="0">行政、监察机关</tspan><tspan x="127.2" dy="47.99999999999999">审判、检察机关</tspan></text><text x="645.6" y="645.6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="645.6" dy="0">这些机关对产生它的人大</tspan><tspan x="645.6" dy="47.99999999999999">负责，受该人大监督。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">箭头只表产生；负责与监督看右侧明确的主客体。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">宪法第2、3条；选举层级未展开，非各级均全民直选</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">7 / 38</tspan></text></svg>