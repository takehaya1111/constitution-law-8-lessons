<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900"><title>延伸讨论二讲评：规范提供要求，履职需要落实</title><desc>由课程内容源生成的可回查SVG，实际PPT导出预览见PDF及逐页PNG。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D32"/></marker></defs><rect width="1600" height="900" fill="#F7F4ED"/><text x="93.60000000000001" y="67.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28.333333333333332" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="93.60000000000001" dy="0">100分钟条件性扩展｜第二学时增加5分钟</tspan></text><text x="91.2" y="166.79999999999998" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="91.2" dy="0">延伸讨论二讲评：规范提供要求，履职需要落实</tspan></text><rect x="93.60000000000001" y="252" width="9.6" height="256.80000000000007" fill="#9B3D32"/><text x="121.2" y="293.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="121.2" dy="0">可以继续查明</tspan></text><text x="447.6" y="293.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="447.6" dy="0">请求是否依法受理、事实是否核实、义务是否履行，以</tspan><tspan x="447.6" dy="47.99999999999999">及有关纠正途径。</tspan></text><rect x="93.60000000000001" y="541.2" width="9.6" height="256.80000000000007" fill="#9B3D32"/><text x="121.2" y="583.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="121.2" dy="0">分别判断</tspan></text><text x="447.6" y="583.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="447.6" dy="0">未依法落实可能揭示实施