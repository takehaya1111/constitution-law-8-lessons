<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900"><title>必要信息与取得信息的方式，可以分开</title><desc>由课程内容源生成的可回查SVG，实际PPT导出预览见PDF及逐页PNG。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9B3D32"/></marker></defs><rect width="1600" height="900" fill="#F7F4ED"/><text x="93.60000000000001" y="67.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28.333333333333332" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="93.60000000000001" dy="0">下节｜第一讲 宪法总论</tspan></text><text x="91.2" y="166.79999999999998" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="60" font-weight="700" fill="#343E3B" text-anchor="start"><tspan x="91.2" dy="0">必要信息与取得信息的方式，可以分开</tspan></text><rect x="93.60000000000001" y="249.60000000000002" width="679.2" height="480" fill="#FFFFFF"/><text x="120" y="311.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="120" dy="0">第12条第1款节录</tspan></text><text x="120" y="403.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="120" dy="0">要求赔偿应当递交申请书，申请</tspan><tspan x="120" dy="47.99999999999999">书应当载明下列事项：</tspan><tspan x="120" dy="47.99999999999999">（二）具体的要求、</tspan><tspan x="120" dy="47.99999999999999">事实根据和理由；</tspan></text><rect x="830.4000000000001" y="249.60000000000002" width="679.2" height="480" fill="#E8ECE6"/><text x="856.8000000000001" y="311.99999999999994" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="856.8000000000001" dy="0">第12条第2款</tspan></text><text x="856.8000000000001" y="403.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#2B302F" text-anchor="start"><tspan x="856.8000000000001" dy="0">赔偿请求人书写申请书确有困难</tspan><tspan x="856.8000000000001" dy="47.99999999999999">的，可以委托他人代书；也可以</tspan><tspan x="856.8000000000001" dy="47.99999999999999">口头申请，由</tspan><tspan x="856.8000000000001" dy="47.99999999999999">赔偿义务机关记入笔录。</tspan></text><text x="94.80000000000001" y="799.2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#9B3D32" text-anchor="start"><tspan x="94.80000000000001" dy="0">要求解释关系；可以用自己的措辞组织理由。</tspan></text><text x="93.60000000000001" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="start"><tspan x="93.60000000000001" dy="0">国家赔偿法第12条第1款起句、第2项及第2款；甲书写困难为明确教学延伸</tspan></text><text x="1507.2" y="860.4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#616966" text-anchor="end"><tspan x="1507.2" dy="0">22 / 31</tspan></text></svg>