<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="B2-title B2-desc"><title id="B2-title">同一份承诺，具体职责各有依据</title><desc id="B2-desc">从现行文本进入，再回查形成理由</desc><rect width="1280" height="720" fill="#fbfaf7"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="56" y="43" font-size="18" fill="#23667c" font-weight="600">B2 · 从现行文本进入，再回查形成理由</text><text x="56" y="102" font-size="40" fill="#203541" font-weight="600">同一份承诺，具体职责各有依据</text><line x1="56" y1="126" x2="1224" y2="126" stroke="#cad4d7" stroke-width="2"/><rect x="56" y="158" width="1168" height="110" fill="#edf3f5" stroke="none" stroke-width="1.5"/><text x="79" y="194" font-size="20" fill="#23667c" font-weight="600">现行誓词节录｜2018年修订决定第二项</text><text x="79" y="241" font-size="28" fill="#203541" font-weight="600">忠于中华人民共和国宪法　／　履行法定职责　／　接受人民监督</text><rect x="56" y="310" width="552" height="203" fill="none" stroke="#cad4d7" stroke-width="1.5"/><rect x="648" y="310" width="576" height="203" fill="none" stroke="#cad4d7" stroke-width="1.5"/><text x="84" y="360" font-size="32" fill="#23667c" font-weight="600">共同的宪法要求</text><text x="84" y="408" font-size="25" fill="#203541" font-weight="400">守宪要求已经存在（第5条）</text><text x="84" y="457" font-size="25" fill="#203541" font-weight="400">依法公开宣誓（第27条第3款）</text><text x="678" y="360" font-size="32" fill="#23667c" font-weight="600">各岗位的法定职责</text><text x="678" y="408" font-size="27" fill="#203541" font-weight="400">具体职责和权限</text><text x="678" y="457" font-size="27" fill="#203541" font-weight="400">仍须查相应法律规定</text><g class="explain"><text x="56" y="566" font-size="29" fill="#203541" font-weight="600">统一誓词表达共同承诺，并不使不同岗位的权限相同。</text><text x="56" y="613" font-size="24" fill="#9a572c" font-weight="400">回查形成理由：2015年说明如何从岗位差异作出统一选择？</text></g><line x1="56" y1="660" x2="1224" y2="660" stroke="#cad4d7" stroke-width="2"/><text x="56" y="692" font-size="17" fill="#53646b" font-weight="400">范围：依法应当宣誓的国家工作人员｜2015年起草理由与2018年现行誓词分别标注。</text></g></svg>