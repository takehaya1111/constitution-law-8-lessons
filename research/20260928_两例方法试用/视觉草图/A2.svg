<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="A2-title A2-desc"><title id="A2-title">把两条规定放在一起读</title><desc id="A2-desc">先辨清条文关系，再用设例检查</desc><rect width="1280" height="720" fill="#fbfaf7"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="56" y="43" font-size="18" fill="#23667c" font-weight="600">A2 · 先辨清条文关系，再用设例检查</text><text x="56" y="102" font-size="40" fill="#203541" font-weight="600">把两条规定放在一起读</text><line x1="56" y1="126" x2="1224" y2="126" stroke="#cad4d7" stroke-width="2"/><rect x="56" y="157" width="1168" height="84" fill="#edf3f5" stroke="none" stroke-width="1.5"/><text x="78" y="191" font-size="19" fill="#23667c" font-weight="600">第33条第2款</text><text x="78" y="226" font-size="30" fill="#203541" font-weight="600">中华人民共和国公民在法律面前一律平等。</text><text x="56" y="285" font-size="21" fill="#23667c" font-weight="600">第34条全文</text><text x="56" y="331" font-size="27" fill="#203541">中华人民共和国<tspan fill="#23667c" font-weight="600">年满十八周岁</tspan>的公民，不分民族、种族、性别、职业、家庭</text><text x="56" y="375" font-size="27" fill="#203541">出身、宗教信仰、<tspan fill="#23667c" font-weight="600">教育程度、财产状况</tspan>、居住期限，都有选举权和被选举</text><text x="56" y="419" font-size="27" fill="#203541">权；但是<tspan fill="#9a572c" font-weight="600">依照法律被剥夺政治权利的人除外</tspan>。</text><g class="explain"><line x1="56" y1="456" x2="1224" y2="456" stroke="#cad4d7" stroke-width="2"/><text x="56" y="505" font-size="27" fill="#23667c" font-weight="600">采用的条件</text><text x="470" y="505" font-size="27" fill="#23667c" font-weight="600">被排除的差别</text><text x="904" y="505" font-size="27" fill="#9a572c" font-weight="600">明示的例外</text><text x="56" y="550" font-size="23" fill="#203541" font-weight="400">满十八周岁</text><text x="470" y="550" font-size="23" fill="#203541" font-weight="400">教育程度、财产状况等</text><text x="904" y="550" font-size="23" fill="#203541" font-weight="400">依法被剥夺政治权利</text><text x="56" y="612" font-size="25" fill="#203541" font-weight="400">再用同一组设例检查；附加规则仍须接受宪法第5条的约束。</text></g><line x1="56" y1="660" x2="1224" y2="660" stroke="#cad4d7" stroke-width="2"/><text x="56" y="692" font-size="17" fill="#53646b" font-weight="400">依据：宪法第5、33、34条｜两条文的关系解释，不是完整的平等权审查标准。</text></g></svg>