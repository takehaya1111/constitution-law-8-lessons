<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="A1-title A1-desc"><title id="A1-title">同是公民，差别怎样进入判断？</title><desc id="A1-desc">先比较情境，再找依据</desc><rect width="1280" height="720" fill="#fbfaf7"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="56" y="43" font-size="18" fill="#23667c" font-weight="600">A1 · 先比较情境，再找依据</text><text x="56" y="102" font-size="40" fill="#203541" font-weight="600">同是公民，差别怎样进入判断？</text><line x1="56" y1="126" x2="1224" y2="126" stroke="#cad4d7" stroke-width="2"/><text x="56" y="155" font-size="20" fill="#203541" font-weight="400">教学设例｜均为中国公民，且未被依法剥夺政治权利</text><text x="56" y="185" font-size="20" fill="#23667c" font-weight="600">判断范围：第34条规定的选举权和被选举权资格</text><rect x="56" y="210" width="560" height="273" fill="none" stroke="#cad4d7" stroke-width="1.5"/><rect x="644" y="210" width="580" height="273" fill="none" stroke="#cad4d7" stroke-width="1.5"/><text x="84" y="246" font-size="26" fill="#203541" font-weight="600">第一组：年龄不同</text><text x="673" y="246" font-size="26" fill="#203541" font-weight="600">第二组：财产、教育程度不同</text><text x="91" y="298" font-size="24" fill="#203541" font-weight="400">甲</text><text x="354" y="298" font-size="24" fill="#203541" font-weight="400">乙</text><text x="89" y="366" font-size="64" fill="#23667c" font-weight="600">17</text><text x="183" y="366" font-size="24" fill="#203541" font-weight="400">周岁</text><text x="353" y="366" font-size="64" fill="#23667c" font-weight="600">18</text><text x="447" y="366" font-size="24" fill="#203541" font-weight="400">周岁</text><line x1="326" y1="270" x2="326" y2="405" stroke="#cad4d7" stroke-width="2"/><text x="88" y="448" font-size="24" fill="#9a572c" font-weight="400">第34条怎样处理这个条件？</text><text x="678" y="298" font-size="24" fill="#203541" font-weight="400">丙</text><text x="954" y="298" font-size="24" fill="#203541" font-weight="400">丁</text><text x="676" y="352" font-size="38" fill="#23667c" font-weight="600">18周岁</text><text x="952" y="352" font-size="38" fill="#23667c" font-weight="600">18周岁</text><line x1="932" y1="270" x2="932" y2="405" stroke="#cad4d7" stroke-width="2"/><text x="678" y="396" font-size="22" fill="#203541" font-weight="400">财产、教育程度</text><text x="953" y="396" font-size="22" fill="#203541" font-weight="400">与丙不同</text><text x="678" y="448" font-size="24" fill="#9a572c" font-weight="400">这些差别能否排除这项权利？</text><g class="explain"><rect x="56" y="516" width="1168" height="115" fill="#edf3f5" stroke="none" stroke-width="1.5"/><text x="79" y="556" font-size="27" fill="#23667c" font-weight="600">第34条采用年龄条件，同时明确不分教育程度、财产状况等。</text><text x="79" y="600" font-size="25" fill="#203541" font-weight="400">另加一份规则，还要核查它是否与宪法相抵触（第5条）。</text></g><line x1="56" y1="660" x2="1224" y2="660" stroke="#cad4d7" stroke-width="2"/><text x="56" y="692" font-size="17" fill="#53646b" font-weight="400">依据：宪法第5、33、34条｜这里只判断条文列明的资格，不代替具体登记程序核查。</text></g></svg>