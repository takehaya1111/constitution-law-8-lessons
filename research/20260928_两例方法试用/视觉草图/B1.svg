<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="B1-title B1-desc"><title id="B1-title">岗位不同，宪法宣誓誓词要不要不同？</title><desc id="B1-desc">从起草时的真实问题进入</desc><rect width="1280" height="720" fill="#fbfaf7"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="56" y="43" font-size="18" fill="#23667c" font-weight="600">B1 · 从起草时的真实问题进入</text><text x="56" y="102" font-size="40" fill="#203541" font-weight="600">岗位不同，宪法宣誓誓词要不要不同？</text><line x1="56" y1="126" x2="1224" y2="126" stroke="#cad4d7" stroke-width="2"/><text x="56" y="168" font-size="25" fill="#203541" font-weight="400">2015年起草说明提出的问题：是否使用统一的誓词？</text><rect x="56" y="201" width="552" height="115" fill="none" stroke="#cad4d7" stroke-width="1.5"/><rect x="648" y="201" width="576" height="115" fill="none" stroke="#cad4d7" stroke-width="1.5"/><text x="86" y="248" font-size="32" fill="#203541" font-weight="600">按岗位分别表述？</text><text x="86" y="289" font-size="23" fill="#9a572c" font-weight="400">可以突出哪些差异</text><text x="678" y="248" font-size="32" fill="#203541" font-weight="600">采用统一誓词？</text><text x="678" y="289" font-size="23" fill="#9a572c" font-weight="400">需要找到什么共同要求</text><text x="56" y="351" font-size="20" fill="#53646b" font-weight="400">上面是供课堂思考的可能选择，不是已核实的两份对立草案。</text><g class="explain"><rect x="56" y="379" width="1168" height="210" fill="#edf3f5" stroke="none" stroke-width="1.5"/><text x="80" y="416" font-size="21" fill="#23667c" font-weight="600">2015年说明记录的理由</text><text x="80" y="462" font-size="29" fill="#203541" font-weight="600">级别、种类、工作任务不同；共同的宪法要求相同。</text><text x="80" y="508" font-size="26" fill="#203541" font-weight="400">据此支持统一誓词，并考虑统一、规范所具有的严肃性。</text><text x="80" y="555" font-size="26" fill="#203541" font-weight="400">现行誓词仍要求“履行法定职责”“接受人民监督”。</text></g><text x="56" y="632" font-size="22" fill="#23667c" font-weight="400">2015年7月决定　→　2018年2月修订　→　2018年3月入宪</text><line x1="56" y1="660" x2="1224" y2="660" stroke="#cad4d7" stroke-width="2"/><text x="56" y="692" font-size="17" fill="#53646b" font-weight="400">来源：2015年起草说明，公报719页；2018年修订决定；宪法第5、27条。</text></g></svg>